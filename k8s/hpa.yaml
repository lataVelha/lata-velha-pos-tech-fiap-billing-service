apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lata-velha-billing
  namespace: lata-velha-billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lata-velha-billing
  minReplicas: 2
  maxReplicas: 4
  metrics:
    # Só CPU: por memória a JVM (heap reservado) deixaria a HPA travada no máximo
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
