# Valores entre chaves preenchidos pelo Terraform (templatefile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lata-velha-billing-config
  namespace: lata-velha-billing
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_FLYWAY_ENABLED: "true"
  # URL pública do webhook (API Gateway do próprio billing-service). Vai em
  # cada preferência como notification_url.
  MERCADOPAGO_NOTIFICATION_URL: "${notification_url}"
  MERCADOPAGO_BACK_URL_SUCCESS: "${back_url_success}"
  MERCADOPAGO_BACK_URL_FAILURE: "${back_url_failure}"
  MERCADOPAGO_BACK_URL_PENDING: "${back_url_pending}"
  MESSAGING_PROVIDER: "sqs"
  MESSAGING_SQS_REGION: "us-east-1"
  MESSAGING_SQS_TOPIC_ARN: "${messaging_topic_arn}"
  MESSAGING_SQS_QUEUE_URL: "${messaging_queue_url}"
  # O handler de DiagnosticoFinalizado consulta o inventory para precificar peças.
  INVENTORY_SERVICE_BASE_URL: "http://lata-velha-inventory.lata-velha-inventory.svc.cluster.local"
  OTEL_SERVICE_NAME: "lata-velha-billing-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED: "true"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
  DEPLOYMENT_ENVIRONMENT_NAME: "prod"
  SERVICE_VERSION: "${service_version}"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=prod,service.version=${service_version},service.name=lata-velha-billing-service"
