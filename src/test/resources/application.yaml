spring:
  datasource:
    url: jdbc:h2:mem:billing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

messaging:
  provider: noop

inventory-service:
  base-url: http://localhost:9999

mercadopago:
  base-url: https://api.mercadopago.test
  access-token: TEST-token
  notification-url: https://api.lata-velha.test/pagamentos/webhook
  webhook-secret: segredo-de-teste
  connect-timeout: 1s
  read-timeout: 1s
  back-urls:
    success: https://lata-velha.test/sucesso
    failure:
    pending:
