spring:
  application:
    name: lata-velha-billing-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lata_velha_billing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

# Mesmo motivo do app: o API Gateway termina o https e repassa http pro ALB
# interno com X-Forwarded-Proto — sem isso as URLs geradas saem como http://.
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

mercadopago:
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  # Access token da aplicação no painel do Mercado Pago (TEST-... para sandbox).
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  # URL pública (API Gateway) que o Mercado Pago chama em cada mudança de
  # status. Vazio = usa a URL configurada no painel "Webhooks" da aplicação.
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
  # Chave secreta gerada no painel "Webhooks". Usada para validar o header
  # x-signature. Vazio = validação desligada (somente para desenvolvimento).
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  connect-timeout: ${MERCADOPAGO_CONNECT_TIMEOUT:5s}
  read-timeout: ${MERCADOPAGO_READ_TIMEOUT:15s}
  back-urls:
    success: ${MERCADOPAGO_BACK_URL_SUCCESS:}
    failure: ${MERCADOPAGO_BACK_URL_FAILURE:}
    pending: ${MERCADOPAGO_BACK_URL_PENDING:}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

messaging:
  provider: ${MESSAGING_PROVIDER:rabbitmq}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:lata-velha.events}
    queue: ${RABBITMQ_QUEUE:lata-velha-billing-service.events}
  sqs:
    region: ${MESSAGING_SQS_REGION:us-east-1}
    topic-arn: ${MESSAGING_SQS_TOPIC_ARN:}
    queue-url: ${MESSAGING_SQS_QUEUE_URL:}
    wait-time-seconds: ${MESSAGING_SQS_WAIT_TIME_SECONDS:20}

inventory-service:
  base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}

billing:
  mail:
    from: ${MAIL_FROM:noreply@latavelha.com.br}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  resource:
    attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
      service.version: ${SERVICE_VERSION:0.0.1}
      service.instance.id: ${HOSTNAME:unknown}
      host.name: ${HOSTNAME:unknown}
  exporter:
    otlp:
      enabled: ${OTEL_EXPORTER_OTLP_ENABLED:true}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.us5.datadoghq.com}
      timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:30000}
      retry:
        enabled: true
        max-attempts: ${OTEL_EXPORTER_RETRY_MAX_ATTEMPTS:5}
        initial-backoff: ${OTEL_EXPORTER_RETRY_INITIAL_BACKOFF:1000ms}
        max-backoff: ${OTEL_EXPORTER_RETRY_MAX_BACKOFF:10000ms}
        backoff-multiplier: ${OTEL_EXPORTER_RETRY_BACKOFF_MULTIPLIER:2.0}
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://otlp.us5.datadoghq.com/v1/traces}
      metrics:
        endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://otlp.us5.datadoghq.com/v1/metrics}
        temporality-preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:delta}
      logs:
        endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:https://otlp.us5.datadoghq.com/v1/logs}
      headers:
        dd-api-key: ${DD_API_KEY:}
  instrumentation:
    common-endpoint:
      capture-request-headers: true
      capture-response-headers: true
    logback-appender:
      enabled: true
      experimental:
        capture-mdc-attributes: '*'
    spring-webmvc:
      enabled: true
      experimental:
        capture-request-parameters: true
    spring-webflux:
      enabled: true
    spring-data:
      enabled: true
    jdbc:
      enabled: true
    log4j-appender:
      enabled: false
    java-util-logging:
      enabled: false
